server:
  port: 8082

spring:
  application:
    name: food-delivery

  datasource:
    url: jdbc:postgresql://localhost:5432/food_delivery?options=-c%20TimeZone=UTC
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: 1234567890123456789012345678901234567890123456789012345678901234
  expiration: 3600000